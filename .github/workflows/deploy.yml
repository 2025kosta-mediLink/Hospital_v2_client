name: Deploy

on:
  push:
    branches: [ "develop", "main" ]

env:
  IMAGE_NAME: medlink/hospital-api
  DOCKER_CONTEXT_PATH: .
  DOCKERFILE: Dockerfile

jobs:
  build-image:
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: JDK 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle 캐시
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 애플리케이션 빌드
        run: ./gradlew clean bootJar

      - name: Docker 로그인 (Docker Hub)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker 이미지 빌드
        run: |
          docker build \
            --file $DOCKERFILE \
            --tag $IMAGE_NAME:${{ github.sha }} \
            $DOCKER_CONTEXT_PATH

      - name: 브랜치별 태그 생성
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            docker tag $IMAGE_NAME:${{ github.sha }} $IMAGE_NAME:prod
          else
            docker tag $IMAGE_NAME:${{ github.sha }} $IMAGE_NAME:staging
          fi

      - name: Docker 이미지 푸시
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}
          if [ "${{ github.ref_name }}" = "main" ]; then
            docker push $IMAGE_NAME:prod
          else
            docker push $IMAGE_NAME:staging
          fi

  deploy:
    needs: build-image
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.ref_name }}

    steps:
      - name: 배포 스크립트 실행 (SSH)
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd /opt/medlink

            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}

            if [ "$TARGET_BRANCH" = "main" ]; then
              TAG=prod
              COMPOSE_FILE=docker-compose.prod.yml
              ENV_FILE=docker-compose.prod.env
            else
              TAG=staging
              COMPOSE_FILE=docker-compose.staging.yml
              ENV_FILE=docker-compose.staging.env
            fi

            docker pull $IMAGE_NAME:${{ github.sha }}
            docker tag $IMAGE_NAME:${{ github.sha }} $IMAGE_NAME:$TAG

            docker compose \
              --env-file $ENV_FILE \
              -f docker-compose.yml \
              -f $COMPOSE_FILE \
              up -d

            docker image prune -f